name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and GitHub release (archived by Zenodo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Code and data for the study of rheumatic valve surgery in Brazil's public health system (SUS), 2003–2025. Reproduces every table and figure of the manuscript and its supplementary material."
